<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:JBM;font-weight:500;src:url(../../../src/renderer/src/assets/fonts/jetbrains-mono-latin-500-normal.woff2)}
html,body{margin:0} body{width:1500px;font:500 13px/1 JBM,monospace;letter-spacing:.14em}
.row{display:grid;grid-template-columns:repeat(3,1fr);height:250px;position:relative}
.cell{display:flex;align-items:center;justify-content:center}
.cell img{height:72px}
.lab{position:absolute;left:24px;top:20px}
.heads{display:grid;grid-template-columns:repeat(3,1fr);background:#0d0d0f;color:#cfc8bd;height:44px;align-items:center;text-align:center}
.small .cell{gap:44px} .small .cell img.a{height:auto;width:80px} .small .cell img.b{height:auto;width:160px}
.small{height:120px}
</style></head><body>
<div class="heads"><div>A · foxbox</div><div>B · FoxBox</div><div>C · FOXBOX</div></div>
<div class="row" style="background:#15100D"><span class="lab" style="color:#8f8a84">STRINGS · #15100D</span>
<div class="cell"><img src="foxbox-lower.svg"></div><div class="cell"><img src="foxbox-title.svg"></div><div class="cell"><img src="foxbox-caps.svg"></div></div>
<div class="row" style="background:#070b14"><span class="lab" style="color:#9aabc2">VOICE · #070B14</span>
<div class="cell"><img src="foxbox-lower.svg"></div><div class="cell"><img src="foxbox-title.svg"></div><div class="cell"><img src="foxbox-caps.svg"></div></div>
<div class="row small" style="background:#15100D"><span class="lab" style="color:#8f8a84">80 / 160 PX</span>
<div class="cell"><img class="a" src="foxbox-lower.svg"><img class="b" src="foxbox-lower.svg"></div><div class="cell"><img class="a" src="foxbox-title.svg"><img class="b" src="foxbox-title.svg"></div><div class="cell"><img class="a" src="foxbox-caps.svg"><img class="b" src="foxbox-caps.svg"></div></div>
<div class="row small" style="background:#070b14">
<div class="cell"><img class="a" src="foxbox-lower.svg"><img class="b" src="foxbox-lower.svg"></div><div class="cell"><img class="a" src="foxbox-title.svg"><img class="b" src="foxbox-title.svg"></div><div class="cell"><img class="a" src="foxbox-caps.svg"><img class="b" src="foxbox-caps.svg"></div></div>
</body></html>
