<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
.p{width:1200px;display:grid;grid-template-columns:1fr;gap:0}

.s img{width:860px}
.dark{background:#1b1b1d}.light{background:#f4ede0}.ember{background:#f25a1d}

</style></head><body><div class="p">
<div class="s dark"><img src="wm-ember.svg"></div>

<div class="s small dark"><img src="wm-cream.svg"><img class="xs" src="wm-cream.svg"><img src="wm-ember.svg"></div>
</div></body></html>
